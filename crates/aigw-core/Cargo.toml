[package]
name = "aigw-core"
version = "0.1.0"
edition = "2021"
description = "AI Gateway core library — data models, database, router, middleware"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true, optional = true }
reqwest-middleware = { version = "0.3", optional = true, features = ["json"] }
reqwest-retry = { version = "0.6", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
fastrand = "2"
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
crypto_secretbox = "0.1.1"
base64 = "0.22"
aes-gcm = "0.11.0"
getrandom = "0.4.3"
hmac = "0.12"
pbkdf2 = "0.12"
jsonwebtoken = { workspace = true }
scrypt = { workspace = true }
rand = "0.8"
prometheus = { version = "0.14.0", features = ["process"] }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "http-proto"] }
tracing-opentelemetry = "0.33"
# Body Archive — Parquet cold storage
parquet = { version = "54", features = ["arrow", "zstd", "async", "object_store"] }
arrow = { version = "54" }
object_store = { version = "0.11", features = ["aws"] }
moka = { version = "0.12", features = ["sync"] }
bytes = "1"
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mysql"] }

[features]
default = []
reqwest = ["dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-retry"]
integration = []
