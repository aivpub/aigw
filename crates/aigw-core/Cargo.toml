[package]
name = "aigw-core"
version = "0.1.0"
edition = "2021"
description = "AI Gateway core library — data models, database, router, middleware"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
fastrand = "2"
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
crypto_secretbox = "0.1.1"
base64 = "0.22"
aes-gcm = "0.11.0"
getrandom = "0.4.3"
hmac = "0.12"
pbkdf2 = "0.12"
jsonwebtoken = { workspace = true }
scrypt = { workspace = true }
rand = "0.8"
prometheus = { version = "0.14.0", features = ["process"] }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "http-proto"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mysql"] }

[features]
default = []
reqwest-dep = ["reqwest"]
integration = []
