[workspace]
resolver = "2"
members = [
    "crates/aigw-core",
    "crates/aigw-server",
    "crates/aigw-migrate",
    # "crates/aigw-openapi",  # Stage 4
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aivpub/aigw"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Web framework
axum = { version = "0.8", features = ["macros"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "uuid", "chrono"] }
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config
serde_yaml = "0.9"
# UUID
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Utilities
thiserror = "2"
dotenvy = "0.15"
# Crypto
sha2 = "0.10"
hex = "0.4"
# JWT
jsonwebtoken = "9"
# Password hashing
scrypt = "0.11"
# Async traits
async-trait = "0.1"
# Async streams / combinators (used by aigw-migrate spend_logs pipeline)
futures = "0.3"
async-stream = "0.3"
# Embedded static files
rust-embed = "8"
# Tower service
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "fs", "compression-gzip", "compression-deflate", "compression-br"] }
# OpenAPI (Stage 4)
# utoipa = { version = "5", features = ["axum_extras"] }
