version: '3'

tasks:
  doctor:
    desc: "check project health"
    cmds:
      - cargo check --workspace
      - cargo clippy --workspace -- -D warnings 2>/dev/null || true
      - '[ -f docs/deployment.md ] || echo "WARN: docs/deployment.md missing"'
      - '[ -f Dockerfile ] || echo "WARN: Dockerfile missing"'
      - '[ -f docker-compose.yml ] || echo "WARN: docker-compose.yml missing"'
      - echo "doctor passed"

  test:
    desc: "run tests"
    cmds:
      - cargo test --workspace
      - echo "test passed"

  bdd:
    desc: "run mock BDD tests"
    cmds:
      - cargo test --test bdd -p aigw-server
      - echo "bdd passed"

  bdd-real:
    desc: "run real API BDD tests (set AIGW_BASE_URL + AIGW_MASTER_KEY in .env)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        # bridge .env naming: OPENAPI_KEY → OPENAI_API_KEY (server reads this)
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        export AIGW_BASE_URL="${AIGW_BASE_URL:-${OPENAPI_BASE_URL:-http://localhost:4000}}"
        export AIGW_MASTER_KEY="${AIGW_MASTER_KEY:-${OPENAPI_KEY:-${MASTER_KEY:-sk-master-test}}}"
        export AIGW_REAL_API=1
        echo "==> AIGW_BASE_URL=${AIGW_BASE_URL}"
        echo "==> AIGW_MASTER_KEY=$(echo ${AIGW_MASTER_KEY} | cut -c1-8)..."
        cargo test --test bdd -p aigw-server
      - echo "bdd-real passed"

  bdd-real-sqlite:
    desc: "run BDD tests with SQLite (auto DB + server)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        # ProviderRegistry::default_with_env() needs OPENAI_API_KEY
        # resolve_upstream_params() needs OPENAI_API_KEY + OPENAI_BASE_URL
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        # Strip /v1 suffix to prevent double  (resolved upstream
        # already appends /chat/completions).
        export OPENAI_BASE_URL="${OPENAI_BASE_URL%/v1}"
        AIGW_REAL_API=1 AIGW_TEST_DB_DRIVER=sqlite AIGW_TEST_START_SERVER=1 \
          AIGW_REAL_MODEL="${AIGW_REAL_MODEL:-${OPENAPI_MODEL:-}}" \
          AIGW_UPSTREAM_DB_URL="${AIGW_UPSTREAM_DB_URL:-}" \
          AIGW_UPSTREAM_MASTER_KEY="${AIGW_UPSTREAM_MASTER_KEY:-}" \
          cargo test --test bdd -p aigw-server

  bdd-real-pg:
    desc: "run BDD tests with PostgreSQL (auto DB + server)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL%/v1}"
        AIGW_REAL_API=1 AIGW_TEST_DB_DRIVER=postgres AIGW_TEST_START_SERVER=1 \
          AIGW_REAL_MODEL="${AIGW_REAL_MODEL:-${OPENAPI_MODEL:-}}" \
          AIGW_UPSTREAM_DB_URL="${AIGW_UPSTREAM_DB_URL:-}" \
          AIGW_UPSTREAM_MASTER_KEY="${AIGW_UPSTREAM_MASTER_KEY:-}" \
          cargo test --test bdd -p aigw-server

  bdd-real-mysql:
    desc: "run BDD tests with MySQL (auto DB + server)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        AIGW_REAL_API=1 AIGW_TEST_DB_DRIVER=mysql AIGW_TEST_START_SERVER=1 \
          AIGW_UPSTREAM_DB_URL="${AIGW_UPSTREAM_DB_URL:-}" \
          AIGW_UPSTREAM_MASTER_KEY="${AIGW_UPSTREAM_MASTER_KEY:-}" \
          cargo test --test bdd -p aigw-server

  bdd-all:
    desc: "run both mock and real API BDD tests"
    cmds:
      - cargo test --test bdd -p aigw-server
      - AIGW_REAL_API=1 cargo test --test bdd -p aigw-server
      - echo "bdd-all passed"

  test-integration:
    desc: "run integration tests (needs Docker)"
    cmds:
      - cargo test --workspace --features integration
      - echo "integration test passed"

  fe-build:
    desc: "build frontend dist/ (for rust-embed)"
    dir: crates/aigw-frontend
    cmds:
      - npm install --silent
      - npm run build
      - echo "fe-build passed"

  fe-lint:
    desc: "lint frontend"
    dir: crates/aigw-frontend
    cmds:
      - npm run lint
      - echo "fe-lint passed"

  fe-bdd:
    desc: "run Playwright BDD tests (requires: task dev in another terminal)"
    dir: crates/aigw-frontend
    cmds:
      - npx playwright test
      - echo "fe-bdd passed"

  fe-bdd-report:
    desc: "run Playwright BDD tests and show HTML report"
    dir: crates/aigw-frontend
    cmds:
      - npx playwright test --reporter=html
      - npx playwright show-report

  fe-bdd-headed:
    desc: "run Playwright BDD tests in headed browser"
    dir: crates/aigw-frontend
    cmds:
      - npx playwright test --headed

  fe-dev:
    desc: "start Vite dev server (proxy API to :4000)"
    dir: crates/aigw-frontend
    cmds:
      - npm run dev

  build:
    desc: "build release (frontend → rust-embed → binary)"
    cmds:
      - task: fe-build
      - cargo build --workspace --release
      - echo "build passed"

  dev:
    desc: "start server (debug build, embeds frontend)"
    cmds:
      - task: fe-build
      - cargo run -p aigw-server

  fmt:
    desc: "code format check"
    cmds:
      - cargo fmt --all -- --check
      - echo "fmt passed"

  lint:
    desc: "code lint"
    cmds:
      - cargo clippy --workspace -- -D warnings
      - echo "lint passed"

  docker-build:
    desc: "build Docker image"
    cmds:
      - docker build -t aigw:latest .

  docker-up:
    desc: "start docker-compose"
    cmds:
      - docker-compose up -d

  docker-down:
    desc: "stop docker-compose"
    cmds:
      - docker-compose down

  docker-logs:
    desc: "view docker-compose logs"
    cmds:
      - docker-compose logs -f

  docker-test:
    desc: "build and test Docker image"
    cmds:
      - docker build -t aigw:test .
      - docker run --rm aigw:test aigw --help

  clean:
    desc: "clean build artifacts"
    cmds:
      - cargo clean
      - docker-compose down -v 2>/dev/null || true

  status:
    desc: "project status"
    cmds:
      - cargo check --workspace 2>&1 | grep -E "Checking|Finished|error" || true
      - cargo test --workspace 2>&1 | grep -E "running|test result|FAILED" || true
