version: '3'

tasks:
  doctor:
    desc: "check project health"
    cmds:
      - cargo check --workspace
      - cargo clippy --workspace -- -D warnings 2>/dev/null || true
      - '[ -f docs/deployment.md ] || echo "WARN: docs/deployment.md missing"'
      - '[ -f Dockerfile ] || echo "WARN: Dockerfile missing"'
      - '[ -f docker-compose.yml ] || echo "WARN: docker-compose.yml missing"'
      - echo "doctor passed"

  test:
    desc: "run tests"
    cmds:
      - cargo test --workspace
      - echo "test passed"

  bdd:
    desc: "run mock BDD tests"
    cmds:
      - cargo test --test bdd -p aigw-server
      - echo "bdd passed"

  bdd-real:
    desc: "run real API BDD tests (set AIGW_BASE_URL + AIGW_MASTER_KEY in .env)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        # bridge .env naming: OPENAPI_KEY → OPENAI_API_KEY (server reads this)
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        export AIGW_BASE_URL="${AIGW_BASE_URL:-${OPENAPI_BASE_URL:-http://localhost:4000}}"
        export AIGW_MASTER_KEY="${AIGW_MASTER_KEY:-${OPENAPI_KEY:-${MASTER_KEY:-sk-master-test}}}"
        export AIGW_REAL_API=1
        echo "==> AIGW_BASE_URL=${AIGW_BASE_URL}"
        echo "==> AIGW_MASTER_KEY=$(echo ${AIGW_MASTER_KEY} | cut -c1-8)..."
        cargo test --test bdd -p aigw-server
      - echo "bdd-real passed"

  bdd-real-sqlite:
    desc: "run BDD tests with SQLite (auto DB + server)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        # ProviderRegistry::default_with_env() needs OPENAI_API_KEY
        # resolve_upstream_params() needs OPENAI_API_KEY + OPENAI_BASE_URL
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        # Strip /v1 suffix to prevent double  (resolved upstream
        # already appends /chat/completions).
        export OPENAI_BASE_URL="${OPENAI_BASE_URL%/v1}"
        AIGW_REAL_API=1 AIGW_TEST_DB_DRIVER=sqlite AIGW_TEST_START_SERVER=1 \
          AIGW_REAL_MODEL="${AIGW_REAL_MODEL:-${OPENAPI_MODEL:-}}" \
          AIGW_UPSTREAM_DB_URL="${AIGW_UPSTREAM_DB_URL:-}" \
          AIGW_UPSTREAM_ENCRYPT_KEY="${AIGW_UPSTREAM_ENCRYPT_KEY:-}" \
          cargo test --test bdd -p aigw-server

  bdd-real-pg:
    desc: "run BDD tests with PostgreSQL (auto DB + server)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL%/v1}"
        AIGW_REAL_API=1 AIGW_TEST_DB_DRIVER=postgres AIGW_TEST_START_SERVER=1 \
          AIGW_REAL_MODEL="${AIGW_REAL_MODEL:-${OPENAPI_MODEL:-}}" \
          AIGW_UPSTREAM_DB_URL="${AIGW_UPSTREAM_DB_URL:-}" \
          AIGW_UPSTREAM_ENCRYPT_KEY="${AIGW_UPSTREAM_ENCRYPT_KEY:-}" \
          cargo test --test bdd -p aigw-server

  bdd-real-mysql:
    desc: "run BDD tests with MySQL (auto DB + server)"
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAPI_KEY:-}}"
        export OPENAI_BASE_URL="${OPENAI_BASE_URL:-${OPENAPI_BASE_URL:-}}"
        AIGW_REAL_API=1 AIGW_TEST_DB_DRIVER=mysql AIGW_TEST_START_SERVER=1 \
          AIGW_UPSTREAM_DB_URL="${AIGW_UPSTREAM_DB_URL:-}" \
          AIGW_UPSTREAM_ENCRYPT_KEY="${AIGW_UPSTREAM_ENCRYPT_KEY:-}" \
          cargo test --test bdd -p aigw-server

  bdd-all:
    desc: "run both mock and real API BDD tests"
    cmds:
      - cargo test --test bdd -p aigw-server
      - AIGW_REAL_API=1 cargo test --test bdd -p aigw-server
      - echo "bdd-all passed"

  test-integration:
    desc: "run integration tests (needs Docker)"
    cmds:
      - cargo test --workspace --features integration
      - echo "integration test passed"

  fe-build:
    desc: "build frontend dist/ (for rust-embed)"
    dir: crates/aigw-frontend
    cmds:
      - npm install --silent
      - npm run build
      - echo "fe-build passed"

  fe-lint:
    desc: "lint frontend"
    dir: crates/aigw-frontend
    cmds:
      - npm run lint
      - echo "fe-lint passed"

  fe-bdd:
    desc: "run Playwright BDD tests (requires: task dev in another terminal)"
    dir: crates/aigw-frontend
    cmds:
      - npx playwright test
      - echo "fe-bdd passed"

  fe-bdd-report:
    desc: "run Playwright BDD tests and show HTML report"
    dir: crates/aigw-frontend
    cmds:
      - npx playwright test --reporter=html
      - npx playwright show-report

  fe-bdd-headed:
    desc: "run Playwright BDD tests in headed browser"
    dir: crates/aigw-frontend
    cmds:
      - npx playwright test --headed

  fe-dev:
    desc: "start Vite dev server (proxy API to :4000)"
    dir: crates/aigw-frontend
    cmds:
      - npm run dev

  build:
    desc: "build release (frontend → rust-embed → binary)"
    cmds:
      - task: fe-build
      - cargo build --workspace --release
      - echo "build passed"

  setup-cross:
    desc: "install cross-rs if not already present"
    cmds:
      - cargo install cross --locked
    status:
      - which cross

  build-migrate:
    desc: "cross-compile aigw-migrate for Linux x86_64 (musl, static) using cross-rs"
    deps:
      - setup-cross
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    cmds:
      - cross build --release -p aigw-migrate --target x86_64-unknown-linux-musl

  dev:
    desc: "start server (debug build, embeds frontend)"
    cmds:
      - task: fe-build
      - cargo run -p aigw-server

  fmt:
    desc: "code format check"
    cmds:
      - cargo fmt --all -- --check
      - echo "fmt passed"

  lint:
    desc: "code lint"
    cmds:
      - cargo clippy --workspace -- -D warnings
      - echo "lint passed"

  # ── Docker image build ──────────────────────────────────────
  # All build tasks tag as ghcr.io/aivpub/aigw:$(git describe --tags --always --dirty).
  # The registry prefix is fixed even for local-only builds so that
  # docker-compose.yml (which references ghcr.io/aivpub/aigw:latest) can pick
  # them up without editing the compose file.
  #
  # Optimized with cargo-chef + BuildKit cache mounts:
  # - Dependency layer cached until Cargo.toml changes
  # - cargo registry + target/ cache mounts survive across builds
  # - Source-only changes recompile in seconds
  #
  # `IMAGE_REPO` / `IMAGE_TAG` are overridable if you need a different name
  # (e.g. `task docker-build IMAGE_TAG=dev`).

  docker-build:
    desc: "build native-arch Docker image (cached), tag ghcr.io/aivpub/aigw:{git-describe} + :latest"
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/aivpub/aigw"}}'
      IMAGE_TAG:
        sh: git describe --tags --always --dirty
    cmds:
      - docker build -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} -t {{.IMAGE_REPO}}:latest .
      - 'echo "built {{.IMAGE_REPO}}:{{.IMAGE_TAG}} + :latest"'

  docker-build-amd64:
    desc: "build linux/amd64 image (cached), load into local docker"
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/aivpub/aigw"}}'
      IMAGE_TAG:
        sh: git describe --tags --always --dirty
    cmds:
      - docker buildx build --platform linux/amd64 --load -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} -t {{.IMAGE_REPO}}:latest .
      - 'echo "built {{.IMAGE_REPO}}:{{.IMAGE_TAG}} + :latest (linux/amd64)"'

  docker-build-amd64-nocache:
    desc: "build linux/amd64 image WITHOUT cache (full rebuild from scratch)"
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/aivpub/aigw"}}'
      IMAGE_TAG:
        sh: git describe --tags --always --dirty
    cmds:
      - docker buildx build --no-cache --platform linux/amd64 --load -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} -t {{.IMAGE_REPO}}:latest .
      - 'echo "built {{.IMAGE_REPO}}:{{.IMAGE_TAG}} + :latest (linux/amd64, no-cache)"'

  docker-build-arm64:
    desc: "build linux/arm64 image (cached), load into local docker"
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/aivpub/aigw"}}'
      IMAGE_TAG:
        sh: git describe --tags --always --dirty
    cmds:
      - docker buildx build --platform linux/arm64 --load -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} -t {{.IMAGE_REPO}}:latest .
      - 'echo "built {{.IMAGE_REPO}}:{{.IMAGE_TAG}} + :latest (linux/arm64)"'

  docker-build-multiarch:
    desc: |
      build & push multi-arch (linux/amd64,linux/arm64) manifest list to ghcr.io/aivpub/aigw.
      Requires prior `docker login ghcr.io`.  `--push` is mandatory:
      buildx cannot --load a manifest list into local docker.
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/aivpub/aigw"}}'
      IMAGE_TAG:
        sh: git describe --tags --always --dirty
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
    cmds:
      - docker buildx build --platform {{.PLATFORMS}} --push -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} -t {{.IMAGE_REPO}}:latest .
      - 'echo "pushed {{.IMAGE_REPO}}:{{.IMAGE_TAG}} + :latest ({{.PLATFORMS}})"'

  docker-up:
    desc: "start docker-compose"
    cmds:
      - docker-compose up -d

  docker-down:
    desc: "stop docker-compose"
    cmds:
      - docker-compose down

  docker-logs:
    desc: "view docker-compose logs"
    cmds:
      - docker-compose logs -f

  docker-test:
    desc: "build native-arch image and smoke-test it (aigw --help)"
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/aivpub/aigw"}}'
      IMAGE_TAG:
        sh: git describe --tags --always --dirty
    cmds:
      - docker build -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} .
      - docker run --rm {{.IMAGE_REPO}}:{{.IMAGE_TAG}} aigw --help

  clean:
    desc: "clean build artifacts"
    cmds:
      - cargo clean
      - docker-compose down -v 2>/dev/null || true

  status:
    desc: "project status"
    cmds:
      - cargo check --workspace 2>&1 | grep -E "Checking|Finished|error" || true
      - cargo test --workspace 2>&1 | grep -E "running|test result|FAILED" || true
