# =============================================================================
# aigw Production Deployment
#
# Requires an external PostgreSQL or MySQL database.
# Configure via .env (copy from .env.example).
#
# Quick start:
#   cp .env.example .env
#   $EDITOR .env
#   docker compose up -d
# =============================================================================

services:
  aigw:
    image: ghcr.io/aivpub/aigw:latest
    # If building locally instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY must be set in .env}
      - RUST_LOG=${RUST_LOG:-info}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-onprem}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
