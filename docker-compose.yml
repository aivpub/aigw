# =============================================================================
# aigw Production Deployment
#
# Requires an external PostgreSQL or MySQL database.
# Configure via .env (copy from .env.example).
#
# Quick start:
#   cp .env.example .env
#   $EDITOR .env
#   docker compose up -d
# =============================================================================

services:
  aigw:
    image: ghcr.io/aivpub/aigw:latest
    # If building locally instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY must be set in .env}
      - RUST_LOG=${RUST_LOG:-info}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-onprem}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    # ── Graceful shutdown ────────────────────────────────
    # SIGTERM triggers axum::serve().with_graceful_shutdown(),
    # which drains in-flight requests before exiting.
    # stop_grace_period must be ≥ the longest expected upstream
    # response (LLM streaming can take 60-120s for long generations).
    stop_grace_period: 120s
    stop_signal: SIGTERM
    # ── Rolling update (Docker Swarm) ────────────────────
    # start-first: launch new container before stopping old one
    # so there is zero downtime during rollout.
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        delay: 5s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      # Use /health/readiness instead of /health so Docker knows
      # whether the DB is reachable, not just that the process is running.
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
