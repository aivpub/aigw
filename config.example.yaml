# aigw Configuration
# Copy to config.yaml and customize

# general_settings:
#   # Literal-config fallback for ${MASTER_KEY:-sk-master-change-me} / database_url.
#   # CLI/ENV wins over these; both are parsed and used where wired.
#   master_key: ${MASTER_KEY:-sk-master-change-me}
#   database_url: sqlite:/app/data/aigw.db
#   deployment_mode: onprem
#   # /key/generate token payload length (litellm custom_key_generate_length).
#   # Default 22; clamped to 16-64. Wired (Stage 116).
#   custom_key_generate_length: 8
#   # When true, only the master key may create keys via /key/generate.
#   # Wired (Stage 116).
#   disable_custom_api_keys: false
#   # Alert webhook: soft_budget exceedance is POSTed here (JSON, fire-and-forget)
#   # in addition to the warning log. Any HTTP endpoint (Slack/Feishu/webhook).
#   # alert_webhook: https://hooks.example.com/alert
#   # Prometheus histogram bucket overrides (replace defaults when set):
#   # metrics_buckets:
#   #   latency: [0.5, 1, 2, 5, 10, 20, 30]
#   #   ttft: [0.25, 0.5, 1, 2.5, 5, 10]
#   #   queue_time: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1]
#   # Response compression (gzip/deflate/brotli):
#   # compression:
#   #   enabled: true
#   #   level: 6
#   #   algorithms: ["gzip", "deflate", "brotli"]
#   # Maximum accepted HTTP request body size in MiB. Default 32.
#   # Covers large LLM requests (long context, tool definitions, base64 attachments).
#   # Set to 0 to restore axum's built-in 2 MiB limit.
#   request_body_limit_mb: 32
#   # OpenTelemetry distributed tracing (optional)
#   otel:
#     enabled: false
#     endpoint: "http://localhost:4317"
#     service_name: "aigw"
#     sample_rate: 1.0
#     exporter: "otlp_grpc"

# Budget reset — periodic spend reset for entities with budget_duration set.
# budget_reset:
#   enabled: true

model_list:
  # model_list is seeded into proxy_models at boot (idempotent, DB-first):
  # a model with the same model_name as an existing DB row is left untouched,
  # anything new is inserted (created_by="config"). Models resolve from the DB,
  # so the admin API (/model/new) and aigw-migrate remain the source of truth
  # for anything already present. `api_key` may reference ${ENV_VAR} — resolved
  # from `environment_variables` (or shell env) before seeding.
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_base: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY:-}
      rpm: 1000
      tpm: 100000
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_base: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY:-}
      rpm: 2000
      tpm: 200000
  - model_name: claude-sonnet-4-20250514
    litellm_params:
      model: claude-sonnet-4-20250514
      api_base: https://api.anthropic.com/v1
      api_key: ${ANTHROPIC_API_KEY:-}
      rpm: 1000
      tpm: 100000

# Router settings — loaded into the Router at boot (Stage 116): the mapped
# RouterConfig replaces the hardcoded default (routing_strategy / allowed_fails /
# num_retries / cooldown_time), and the initial value is persisted to the config
# table so GET /router/settings returns it before any PUT. NOTE: `cooldown_secs`
# and `disable_cooldowns` in the file are ignored by the serde schema (the field
# is `cooldown_time`); the router picks by `routing_strategy`
# (usage-based-routing-v2 / latency-based-routing / simple-shuffle).
#
# `litellm_settings` (drop_params / request_timeout / set_verbose) and
# `environment_variables` are parsed for litellm compatibility; only
# `environment_variables` is wired (fills missing env vars at boot — dotenvy
# semantics). drop_params/request_timeout/set_verbose have no corresponding
# implementation in aigw yet — documented, not dead-wired.
router_settings:
  routing_strategy: usage-based-routing-v2
  allowed_fails: 3
  cooldown_time: 30
  num_retries: 2

# Response cache — exact-match cache (Stage 119). Absent → enabled with defaults.
# cache:
#   enabled: true
#   backend: memory        # memory now, redis reserved (M2 distributed layer)
#   ttl_seconds: 60
#   max_entries: 10000

# environment_variables:
#   OPENAI_API_KEY: sk-your-key   # filled only if not already set in env

litellm_settings:
  drop_params: true
  request_timeout: 600
  set_verbose: false

# Body Archive — cold storage for spend_logs body fields
# (messages, response, proxy_server_request + metadata columns).
# Archives old rows to Parquet on S3/local storage and optionally nulls
# the body columns in the database after a retention period.
# body_archive:
#   auto_archive: false  # set to true to enable cron-based automatic archiving
#
#   # Storage backend — s3 (S3-compatible object storage) or fs (local filesystem).
#   storage:
#     type: s3  # or fs
#     bucket: "aigw-logs"
#     region: "ap-guangzhou"
#     endpoint: ""           # optional, empty = AWS default
#     access_key_id: "${AWS_ACCESS_KEY_ID}"
#     secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
#     session_token: ""      # optional STS session token
#     prefix: ""             # optional key prefix inside the bucket
#     use_ssl: true
#     compatibility_mode: false  # enable for COS/R2/MinIO
#     url_style: "vhost"     # vhost or path
#
#   # Archive policy — controls when and how data is archived.
#   archive:
#     archive_after_hours: 1       # don't archive rows newer than N hours
#     null_body_after_days: 7      # null body columns after N days (if null_body_after_archive)
#     batch_size: 5000             # rows per archive batch
#     row_group_size: 500          # parquet row group size (default 500)
#     check_interval_secs: 300     # seconds between tick() discovery scans
#     null_body_after_archive: true  # set to false to keep body in DB even after archive
#     vacuum_after_null: true      # VACUUM after nulling (SQLite only)
#     bloom_min_rows: 10           # skip Bloom filter when fewer than N rows (saves ~75% overhead)
#     compression: zstd            # parquet compression: zstd | snappy | gzip | lz4 | none
#     compression_level: 3         # zstd: 1-22, gzip: 1-9 (default: 6)
#     multipart_part_size_mb: 16   # S3 multipart part size (min 5, default 16)
#     max_parquet_body_mb: 64      # per-object compressed-parquet cap before splitting
#
#   # Footer cache — avoids re-fetching parquet footers on repeated reads.
#   # footer_cache:
#   #   mode: mem          # none | mem | redis
#   #   max_capacity: 10000
#   #   ttl_secs: 3600
#
#   # Column chunk cache — local disk cache for hot column chunks.
#   # col_chunk_cache:
#   #   mode: fs           # none | fs
#   #   dir: /tmp/aigw_parquet_cache
#   #   max_size_mb: 1024
#   #   max_entry_mb: 100

# ── Built-in web search (Phase 53) ────────────────────────────────────────────
# Absent → disabled, zero behaviour change. Only `kind: searxng` is implemented;
# an unknown kind fails startup with a message listing the supported kinds.
#
# web_search:
#   enabled: true
#   default_provider: searxng    # must appear in providers[].name
#   failover_order: [searxng]    # provider-to-provider chain; a no-op with a
#                                # single provider, but parsed and validated so
#                                # adding a vendor is a YAML change only
#   max_results: 5               # server-side ceiling; clients may lower, never raise
#   timeout_ms: 5000             # global per-search timeout
#   retries: 1                   # transport retries (5xx / network only, never 4xx)
#   snippet_max_chars: 2000
#   allowed_domains: []          # mutually exclusive with blocked_domains
#   blocked_domains: []
#   proxy_url: ""                # empty → direct; non-empty → egress via proxy
#   allowed_fails: 3             # instance-level: failures before cooldown
#   cooldown_secs: 60            # instance-level: cooldown duration
#   providers:
#     - name: searxng
#       kind: searxng
#       # cost_per_query is an AMORTIZED UNIT PRICE, not a purchase price.
#       # The default (0.01 USD = $10/1k) is the OpenAI list-price placeholder —
#       # it is NOT SearXNG's self-hosted cost. Self-hosting is not free, but
#       # amortized cost is typically around 1e-4, so leaving the default
#       # OVERSTATES cost by roughly 50x. Rewrite it as
#       #   (server + bandwidth + ops) / estimated monthly queries
#       # An explicit 0.0 is allowed, but then "what did search cost" becomes
#       # unanswerable — a visible over-estimate beats a silent zero.
#       cost_per_query: 0.0002
#       timeout_ms: 8000         # overrides the global value: SearXNG measures
#                                # 2.0-3.1s because it waits for every engine,
#                                # so 5000 is tight. Note this lands directly on
#                                # TTFT — the search runs before the upstream call.
#       instances:               # physical endpoints: availability + traffic split
#         - base_url: http://searxng-a.internal:8080
#           weight: 2            # if ANY instance declares a weight, all selection
#                                # goes weighted; weight: 0 excludes an instance
#           enabled: true
#         - base_url: http://searxng-b.internal:8080
#           weight: 1
#           enabled: true
#           # api_key: v2:gcm:...   # per-instance; plaintext or v2:gcm: ciphertext.
#                                   # SearXNG needs no auth, so normally omitted.
#
# The instance must have JSON output enabled (`search.formats` includes `json` in
# its settings.yml) — otherwise it answers HTTP 200 with an HTML page, or 403.
# Most public instances disable JSON, so self-hosting is effectively required.
